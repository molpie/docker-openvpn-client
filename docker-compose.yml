# Use this file as an example if you need help writing your Compose files.
# The commented-out parts may or may not be relevant to your setup.

services:
  openvpn-client:
    build: ./build
    # image: ghcr.io/wfg/openvpn-client:latest
    container_name: openvpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - KILL_SWITCH=on
      # - SUBNETS=192.168.10.0/24
      - HTTP_PROXY=off
      - SOCKS_PROXY=off
      # - PROXY_USERNAME=myuser
      # - PROXY_PASSWORD=mypassword
      # - PROXY_USERNAME_SECRET=username  # must match the secret name below
      # - PROXY_PASSWORD_SECRET=password  # must match the secret name below
      # - VPN_LOG_LEVEL=3
    volumes:
      - ./local/vpn:/vpn:ro
    ports:
      - "8080:8080"   # Tinyproxy HTTP proxy
      - "1080:1080"   # Dante SOCKS proxy
    # secrets:
    #   - username
    #   - password
    restart: unless-stopped

# secrets:
#   username:
#     file: ./local/secrets/username
#   password:
#     file: ./local/secrets/password
